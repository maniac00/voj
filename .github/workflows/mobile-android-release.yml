name: Android APK Release Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.1)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/voj-release.keystore
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=voj
          storeFile=../voj-release.keystore
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=VOJ_API_BASE_URL=${{ secrets.API_BASE_URL || 'https://voj-api.up.railway.app/api/v1' }}

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK to R2
        if: secrets.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          # Install wrangler
          npm install -g wrangler

          # Upload versioned APK
          wrangler r2 object put "voj-releases/android/voice-of-juan-v${VERSION}.apk" \
            --file="$APK_PATH"

          # Upload as latest
          wrangler r2 object put "voj-releases/android/voice-of-juan-latest.apk" \
            --file="$APK_PATH"

          # Update metadata.json
          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          # R2_PUBLIC_URL: voj-releases Worker URL (workers.dev 또는 커스텀 도메인)
          R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL || 'https://voj-releases.<subdomain>.workers.dev' }}"
          cat > /tmp/metadata.json << METAEOF
          {
            "android": {
              "latestVersion": "${VERSION}",
              "latestBuildNumber": 1,
              "downloadUrl": "${R2_PUBLIC_URL}/android/voice-of-juan-latest.apk",
              "fileSize": ${FILE_SIZE},
              "releaseDate": "$(date -u +%Y-%m-%d)",
              "changelog": "v${VERSION} 릴리스"
            }
          }
          METAEOF
          wrangler r2 object put "voj-releases/metadata.json" \
            --file="/tmp/metadata.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-of-juan-v${{ steps.version.outputs.version }}.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Voice of Juan v${{ steps.version.outputs.version }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
